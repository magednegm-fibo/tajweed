<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>القرآن الكريم - الآيات مرقمة من 1 إلى 6236</title>
<style>

:root{--p:#1a5f4a;--pl:#e8f5f0;--a:#c9a227;--t:#1e2a44;--bg:#fdfaf0;--c:#fff;--b:#e6d9c2;--v:#f9f6ee;--m:#555;color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0 auto;background:var(--bg);color:var(--t);max-width:920px;font-family:"KFGQPC","Traditional Arabic",serif;font-size:27px;line-height:2.1;padding:env(safe-area-inset-top,0px) 10px calc(60px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--b);padding:10px 4px;z-index:5;display:flex;gap:6px;flex-wrap:nowrap;align-items:center;font-family:system-ui,sans-serif;font-size:15px;color:var(--p)}
header input{width:150px;min-width:0;padding:6px 8px;border:1px solid var(--b);border-radius:6px;background:var(--c);color:var(--t);font-size:15px}
header button{flex:none;padding:6px 10px;border:0;border-radius:6px;background:var(--p);color:#fff;font-size:15px;cursor:pointer}
main{padding:0 0 20px}
h2{font-size:1.5rem;line-height:2;font-weight:normal;color:var(--p);background:linear-gradient(to left,var(--pl),transparent);border-right:6px solid var(--a);padding:2px 14px 2px 10px;margin:10px 0 6px;border-radius:0 8px 8px 0}
.v{display:flow-root;text-align:justify;text-align-last:start;background:var(--v);border:1px solid var(--b);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.05);overflow:visible;line-height:2.15}
.v:target,.v.hl{background:#f6ecc4;border-color:var(--a)}
.ruku-sep-row{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 8px;direction:rtl}
.ruku-sep-row .ruku-sep-label{font-family:"KFGQPC","Traditional Arabic",serif;font-size:0.95rem;color:#a77b45;font-weight:700;white-space:nowrap;text-align:center}
.ruku-sep-row .ruku-separator{height:3px;width:18%;max-width:90px;flex:0 0 auto;background:#a77b45;border-radius:3px;opacity:.85;margin:0}
.manzil-separator{display:block;height:3px;width:38%;max-width:180px;background:var(--p);border-radius:3px;margin:10px auto;opacity:.9}
.v.ruku-a,.v.ruku-b{background:#f9f6ee}

.n{display:inline-flex;vertical-align:middle;flex:none;width:1.75rem;height:1.75rem;padding:0;border-radius:50%;background:#e5ebe1;color:#285b48;align-items:center;justify-content:center;font:600 .82rem/1 system-ui,sans-serif;margin:0 0 0 8px;border:1px solid #c8d4c7}
.t{display:inline;line-height:inherit;overflow:visible}
h2.sh{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.s-title{display:inline-flex;align-items:center;gap:10px;min-width:0}
.sid{display:inline-flex;flex:none;align-items:center;justify-content:center;width:2.35rem;height:2.35rem;padding:0;border-radius:50%;background:#e8f2ec;color:var(--p);font:700 1.15rem/1 system-ui,sans-serif;border:1.5px solid #b9cfc3;box-shadow:inset 0 0 0 2px #f8fbf8;direction:rtl}
.tg{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font:700 1.2rem/1 system-ui,sans-serif}
.sur.c{display:none}
header strong{white-space:nowrap;font-size:14px;flex:none}
#info{font-size:11px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .sec{background:var(--p);color:#fff;border:0;min-width:44px;padding:2px 12px;font-size:28px;font-weight:700;line-height:1.2;border-radius:8px}
</style>

<body>
<header>
<strong>القرآن الكريم</strong>
<input id="num" type="text" inputmode="numeric" placeholder="رقم الركوع (١–٥٥٨)">
<button id="go">انتقال</button>
<button id="all" class="sec" title="فتح الكل" aria-label="فتح الكل">+</button>
<button id="none" class="sec" title="طي الكل" aria-label="طي الكل">−</button>
<span id="info"></span>
</header>
<main id="m"></main>
<script>
let Q=null;
var RUKU_FIRST_VERSE=[];

const m=document.getElementById('m');
const NM="الْفَاتِحَةِ|الْبَقَرَةِ|آلِ عِمْرَانَ|النِّسَاءِ|الْمَائِدَةِ|الْأَنْعَامِ|الْأَعْرَافِ|الْأَنْفَالِ|التَّوْبَةِ|يُونُسَ|هُودٍ|يُوسُفَ|الرَّعْدِ|إِبْرَاهِيمَ|الْحِجْرِ|النَّحْلِ|الْإِسْرَاءِ|الْكَهْفِ|مَرْيَمَ|طه|الْأَنْبِيَاءِ|الْحَجِّ|الْمُؤْمِنُونَ|النُّورِ|الْفُرْقَانِ|الشُّعَرَاءِ|النَّمْلِ|الْقَصَصِ|الْعَنْكَبُوتِ|الرُّومِ|لُقْمَانَ|السَّجْدَةِ|الْأَحْزَابِ|سَبَإٍ|فَاطِرٍ|يس|الصَّافَّاتِ|ص|الزُّمَرِ|غَافِرٍ|فُصِّلَتْ|الشُّورَى|الزُّخْرُفِ|الدُّخَانِ|الْجَاثِيَةِ|الْأَحْقَافِ|مُحَمَّدٍ|الْفَتْحِ|الْحُجُرَاتِ|ق|الذَّارِيَاتِ|الطُّورِ|النَّجْمِ|الْقَمَرِ|الرَّحْمَٰنِ|الْوَاقِعَةِ|الْحَدِيدِ|الْمُجَادَلَةِ|الْحَشْرِ|الْمُمْتَحَنَةِ|الصَّفِّ|الْجُمُعَةِ|الْمُنَافِقُونَ|التَّغَابُنِ|الطَّلَاقِ|التَّحْرِيمِ|الْمُلْكِ|الْقَلَمِ|الْحَاقَّةِ|الْمَعَارِجِ|نُوحٍ|الْجِنِّ|الْمُزَّمِّلِ|الْمُدَّثِّرِ|الْقِيَامَةِ|الْإِنْسَانِ|الْمُرْسَلَاتِ|النَّبَإِ|النَّازِعَاتِ|عَبَسَ|التَّكْوِيرِ|الِانْفِطَارِ|الْمُطَفِّفِينَ|الِانْشِقَاقِ|الْبُرُوجِ|الطَّارِقِ|الْأَعْلَى|الْغَاشِيَةِ|الْفَجْرِ|الْبَلَدِ|الشَّمْسِ|اللَّيْلِ|الضُّحَى|الشَّرْحِ|التِّينِ|الْعَلَقِ|الْقَدْرِ|الْبَيِّنَةِ|الزَّلْزَلَةِ|الْعَادِيَاتِ|الْقَارِعَةِ|التَّكَاثُرِ|الْعَصْرِ|الْهُمَزَةِ|الْفِيلِ|قُرَيْشٍ|الْمَاعُونِ|الْكَوْثَرِ|الْكَافِرُونَ|النَّصْرِ|الْمَسَدِ|الْإِخْلَاصِ|الْفَلَقِ|النَّاسِ".split('|');
const RUKU_LENGTHS=[7,7,13,9,10,7,13,2,10,11,4,10,7,9,9,8,12,6,5,11,4,9,6,6,8,14,6,5,7,3,4,7,6,5,4,3,6,7,8,2,3,9,11,10,11,13,9,8,9,11,10,8,11,9,14,5,7,16,9,9,11,10,4,8,3,8,9,8,9,11,6,11,4,5,4,4,8,3,11,8,7,11,10,9,5,5,6,8,7,8,9,7,6,10,11,9,7,7,8,7,5,10,10,10,11,9,5,5,10,12,8,4,6,10,11,8,11,4,6,4,11,10,15,6,8,8,6,5,6,8,12,9,6,9,18,3,12,6,4,6,5,9,10,7,18,10,9,9,9,7,4,10,6,5,6,6,10,8,5,8,5,17,7,6,8,9,10,11,8,4,7,10,10,10,10,13,7,10,12,10,11,6,8,16,11,14,11,8,15,12,14,14,6,14,9,6,7,7,8,11,11,14,11,7,7,11,8,5,6,6,6,6,9,6,7,7,11,15,10,19,16,19,20,9,12,4,9,6,10,10,5,5,6,7,6,11,10,9,9,10,12,8,10,12,8,10,7,7,9,7,11,12,5,5,9,13,5,4,6,11,12,19,9,15,25,10,15,17,16,24,30,22,13,15,11,13,7,10,19,12,9,25,18,19,10,12,3,8,5,10,9,7,8,6,22,10,18,27,15,26,10,10,6,8,6,10,7,4,3,9,11,14,10,16,17,9,24,18,17,36,18,18,19,16,16,36,14,17,13,14,8,16,11,13,8,7,14,8,10,15,7,6,13,9,8,14,7,12,6,10,9,8,13,13,7,11,8,11,4,11,11,8,8,12,7,7,6,12,6,10,5,9,12,9,6,9,9,7,7,12,11,8,12,20,18,17,16,21,53,39,25,44,14,12,14,24,24,9,12,10,10,11,11,7,5,9,11,7,10,13,10,8,10,7,8,10,7,7,12,10,9,10,10,14,10,15,10,10,10,11,11,22,29,13,17,11,10,5,11,10,10,6,9,11,8,9,10,10,7,9,3,10,8,15,14,16,23,23,14,28,21,25,7,30,22,18,15,25,20,33,40,34,22,10,9,6,4,6,7,9,10,7,7,6,7,9,5,8,3,8,3,10,8,7,5,7,5,14,16,33,19,37,15,35,9,20,8,19,9,19,1,31,25,30,10,22,9,40,10,30,10,26,20,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];

async function loadQuranAndRender(){
  const info=document.getElementById('info');
  if(info) info.textContent='جاري تحميل المصحف...';
  try{
    const res=await fetch('https://cdn.jsdelivr.net/npm/quran-json@3.1.2/dist/quran.json');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    // تحويل إلى شكل Q: [id, name, [texts...]]
    Q=data.map(s=>[s.id, s.name, s.verses.map(v=>v.text)]);
  }catch(err){
    if(info) info.textContent='تعذر تحميل نص القرآن. تحقق من الاتصال.';
    console.error(err);
    return;
  }
  if(info) info.textContent='';
  let rukuIndex=0,rukuRemaining=RUKU_LENGTHS[0],g=0,html='';
  const MANZIL_STARTS=new Set([5,10,17,26,37,50]);
  RUKU_FIRST_VERSE.length=0;
  for(const [id,name,vs] of Q){
    if(MANZIL_STARTS.has(id)) html+='<div class="manzil-separator" aria-hidden="true"></div>';
    html+='<h2 class="sh"><span class="s-title"><span class="sid" aria-label="رقم السورة">'+String(id).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d])+'</span><span>سُورَةُ '+NM[id-1]+'</span></span></h2><div class="sur c">';
    for(let k=0;k<vs.length;k++){
      const t=vs[k];g++;
      const rukuNum=rukuIndex+1;
      const rukuClass=(rukuIndex%2===0?'ruku-a':'ruku-b');
      const isFirstOfRuku=(rukuRemaining===RUKU_LENGTHS[rukuIndex]);
      if(isFirstOfRuku) RUKU_FIRST_VERSE[rukuNum]=g;
      html+='<div class="v '+rukuClass+'" id="v'+g+'" data-ruku="'+rukuNum+'"><span class="n">'+String(k+1).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d])+'</span><span class="t">'+t+'</span></div>';
      rukuRemaining--;
      if(rukuRemaining===0){
        if(k < vs.length - 1){
          html+='<div class="ruku-sep-row"><div class="ruku-separator" aria-hidden="true"></div><span class="ruku-sep-label">سُورَةُ '+NM[id-1]+'</span><div class="ruku-separator" aria-hidden="true"></div></div>';
        }
        rukuIndex++;
        rukuRemaining=RUKU_LENGTHS[rukuIndex]||0;
      }
    }
    html+='</div>';
  }
  if(g!==6236||rukuIndex!==558||rukuRemaining!==0){console.error('Quran structure mismatch',g,rukuIndex,rukuRemaining);}
  m.innerHTML=html;
  // بعد الرسم: راقب أول آية من كل سورة لتحميل التفسير مسبقًا
  if(window.__afterQuranRender) window.__afterQuranRender();
}
loadQuranAndRender();

function go(){
  const raw=document.getElementById('num').value.replace(/[\u0660-\u0669]/g,d=>d.charCodeAt(0)-1632).replace(/[\u06F0-\u06F9]/g,d=>d.charCodeAt(0)-1776);const n=parseInt(raw,10);
  if(!(n>=1&&n<=558)){document.getElementById('info').textContent='أدخل رقم ركوع من 1 إلى 558';return;}
  const vid=RUKU_FIRST_VERSE[n];
  if(!vid){document.getElementById('info').textContent='ركوع غير موجود';return;}
  document.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'));
  const e=document.getElementById('v'+vid);
  if(!e){document.getElementById('info').textContent='تعذر الوصول للركوع';return;}
  const s=e.closest('.sur');
  if(s&&s.classList.contains('c'))setS(s.previousElementSibling,true);
  e.classList.add('hl');
  e.scrollIntoView({block:'center'});
  document.getElementById('info').textContent='ركوع '+n;
}
function setS(h,open){h.nextElementSibling.classList.toggle('c',!open);}
m.addEventListener('click',ev=>{const h=ev.target.closest('h2.sh');if(h)setS(h,h.nextElementSibling.classList.contains('c'));});
document.getElementById('all').onclick=()=>m.querySelectorAll('h2.sh').forEach(h=>setS(h,true));
document.getElementById('none').onclick=()=>m.querySelectorAll('h2.sh').forEach(h=>setS(h,false));
document.getElementById('go').onclick=go;
document.getElementById('num').addEventListener('keydown',e=>{if(e.key==='Enter')go()});

// ===== تفسير المختصر - بطاقة تحت الآية =====
(function(){
  const CACHE = {};
  const LOADING = {};
  const globalToSA = [];
  // يُملأ بعد تحميل Q في setupTafsirPreload

  function fetchSurah(s) {
    if (CACHE[s]) return Promise.resolve(CACHE[s]);
    if (LOADING[s]) return LOADING[s];
    LOADING[s] = fetch('https://cdn.jsdelivr.net/gh/spa5k/tafsir_api@main/tafsir/ar-tafsir-al-mukhtasar/' + s + '.json')
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(data => { CACHE[s] = data; delete LOADING[s]; return data; })
      .catch(err => { delete LOADING[s]; throw err; });
    return LOADING[s];
  }

  function setupTafsirPreload(){
    // إعادة بناء globalToSA بعد تحميل Q
    globalToSA.length = 0;
    let g2 = 0;
    for (const [sid, name, vs] of Q) {
      for (let a = 1; a <= vs.length; a++) {
        g2++;
        globalToSA[g2] = {s: sid, a: a, name: name};
      }
    }
    if (!('IntersectionObserver' in window)) return;
    const seen = new Set();
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        const num = parseInt(e.target.id.slice(1), 10);
        const info = globalToSA[num];
        if (info && !seen.has(info.s)) {
          seen.add(info.s);
          fetchSurah(info.s).catch(() => {});
        }
      }
    }, { rootMargin: '400px 0px', threshold: 0 });
    const first = new Set();
    document.querySelectorAll('.v[id^="v"]').forEach(v => {
      const num = parseInt(v.id.slice(1), 10);
      const info = globalToSA[num];
      if (info && !first.has(info.s)) {
        first.add(info.s);
        io.observe(v);
      }
    });
  }
  window.__afterQuranRender = setupTafsirPreload;

  let openCard = null;

  function buildHTML(info, item) {
    const {s, a, name} = info;
    if (!item || !item.text) {
      return '<div class="tafsir-header">سورة ' + name + ' — الآية ' + a + '</div>' +
             '<div class="tafsir-error">لا يوجد تفسير متاح لهذه الآية.</div>';
    }
    return '<div class="tafsir-header">سورة ' + name + ' — الآية ' + a + '</div>' +
           '<div class="tafsir-text">' + item.text + '</div>';
  }

  function hide(card) {
    if (!card) return;
    card.style.display = 'none';
    card.classList.remove('open');
    if (openCard === card) openCard = null;
  }
  function show(card) {
    if (openCard && openCard !== card) hide(openCard);
    card.style.display = 'block';
    card.classList.add('open');
    openCard = card;
  }

  m.addEventListener('click', function(ev) {
    if (ev.target.closest('.tafsir-card')) return;
    if (ev.target.closest('h2.sh')) return;

    const v = ev.target.closest('.v');
    if (!v) return;

    const id = v.id;
    if (!id || !id.startsWith('v')) return;
    const num = parseInt(id.slice(1), 10);
    if (!num || !globalToSA[num]) return;

    let card = v.nextElementSibling;
    if (card && card.classList.contains('tafsir-card')) {
      if (card.classList.contains('open')) hide(card);
      else show(card);
      return;
    }

    const info = globalToSA[num];
    card = document.createElement('div');
    card.className = 'tafsir-card';
    card.style.display = 'none';
    v.after(card);

    const done = (item) => {
      card.innerHTML = buildHTML(info, item);
      card.dataset.loaded = '1';
      show(card);
    };

    if (CACHE[info.s]) {
      done(CACHE[info.s].find(x => Number(x.ayah) === info.a));
    } else {
      fetchSurah(info.s)
        .then(list => done(list.find(x => Number(x.ayah) === info.a)))
        .catch(() => done(null));
    }
  });
})();

</script>
